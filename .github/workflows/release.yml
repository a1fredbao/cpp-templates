name: Release PDF

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install PDF dependencies
        run: pip install -r tools/pdf/requirements.txt
      - name: Generate LaTeX
        run: python -m tools.pdf --preset both --output-dir .
      - name: Download fonts
        run: |
          chmod +x tools/pdf/scripts/download-fonts.sh
          ./tools/pdf/scripts/download-fonts.sh
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            output.tex
            output-compact.tex
          latexmk_use_xelatex: true
          extra_fonts: |
            ./fonts/*.otf
            ./fonts/*.ttf
      - name: Rename output files
        run: |
          for file in output*.pdf; do
            if [ ! -e "$file" ]; then
              continue
            fi
            base="${file%.*}"
            extension=".${file##*.}"
            mv -- "$file" "${base}_${{ github.ref_name }}${extension}"
          done
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: "*_${{ github.ref_name }}.pdf"
